<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이버 블로그 텍스트 다운로더</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f6f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }
    h1 {
      font-size: 22px;
      color: #19ce60;
      margin-bottom: 20px;
      text-align: center;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    label {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    input[type="url"] {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus {
      border-color: #19ce60;
    }
    button {
      padding: 12px;
      background-color: #19ce60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #15b452;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #status {
      font-size: 14px;
      text-align: center;
      color: #666;
      min-height: 20px;
    }
    .error {
      color: #e74c3c !important;
    }
    .success {
      color: #27ae60 !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>네이버 블로그 텍스트 추출기</h1>
    
    <div class="input-group">
      <label for="blog-url">네이버 블로그 주소 (URL)</label>
      <input 
        type="url" 
        id="blog-url" 
        placeholder="https://blog.naver.com/..." 
        required 
      />
      <button id="download-btn" onclick="handleDownload()">텍스트 다운로드</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    async function handleDownload() {
      const urlInput = document.getElementById('blog-url');
      const statusDiv = document.getElementById('status');
      const downloadBtn = document.getElementById('download-btn');
      const blogUrl = urlInput.value.trim();

      if (!blogUrl) {
        setStatus('URL을 입력해주세요.', 'error');
        return;
      }

      setStatus('텍스트를 추출하는 중입니다...', '');
      downloadBtn.disabled = true;

      try {
        const response = await fetch('/.netlify/functions/extract', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ url: blogUrl }),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || '텍스트 추출에 실패했습니다.');
        }

        const data = await response.json();
        const filename = `${data.title || 'blog_content'}.txt`;
        
        downloadTxtFile(filename, data.content);
        setStatus('다운로드가 완료되었습니다.', 'success');

      } catch (error) {
        setStatus(error.message, 'error');
      } finally {
        downloadBtn.disabled = false;
      }
    }

    function downloadTxtFile(filename, text) {
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    function setStatus(message, className) {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = message;
      statusDiv.className = className;
    }
  </script>
</body>
</html>
