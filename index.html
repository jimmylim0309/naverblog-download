<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이버 블로그 텍스트 다중 다운로더</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f6f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 550px;
    }
    h1 {
      font-size: 22px;
      color: #19ce60;
      margin-bottom: 20px;
      text-align: center;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    label {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    textarea {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      height: 150px;
      resize: vertical;
      line-height: 1.5;
      font-family: monospace;
    }
    textarea:focus {
      border-color: #19ce60;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: -6px;
    }
    button {
      padding: 14px;
      background-color: #19ce60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #15b452;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #status {
      font-size: 14px;
      text-align: center;
      color: #666;
      min-height: 20px;
    }
    .error {
      color: #e74c3c !important;
    }
    .success {
      color: #27ae60 !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>네이버 블로그 텍스트 다중 추출기</h1>
    
    <div class="input-group">
      <label for="blog-urls">네이버 블로그 주소 목록 (줄바꿈으로 구분)</label>
      <textarea 
        id="blog-urls" 
        placeholder="https://blog.naver.com/example1&#10;https://blog.naver.com/example2&#10;https://blog.naver.com/example3"
      ></textarea>
      <div class="hint">* 여러 주소를 입력 시 각 글을 txt 파일로 만들어 ZIP으로 압축해 다운로드한다. (최대 20개)</div>
      <button id="download-btn" onclick="handleDownload()">ZIP 파일로 일괄 다운로드</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    async function handleDownload() {
      const urlsInput = document.getElementById('blog-urls');
      const statusDiv = document.getElementById('status');
      const downloadBtn = document.getElementById('download-btn');
      
      const rawText = urlsInput.value.trim();
      if (!rawText) {
        setStatus('URL을 하나 이상 입력해 주세요.', 'error');
        return;
      }

      // 줄바꿈 단위로 URL 분리 및 정제
      const urls = rawText.split('\n')
                          .map(url => url.trim())
                          .filter(url => url.startsWith('http'));

      if (urls.length === 0) {
        setStatus('올바른 URL 형식(http:// 또는 https://)을 입력해 주세요.', 'error');
        return;
      }

      setStatus(`${urls.length}개의 블로그 텍스트를 수집 및 압축하는 중입니다...`, '');
      downloadBtn.disabled = true;

      try {
        const response = await fetch('/.netlify/functions/extract', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ urls: urls }),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || '텍스트 추출에 실패했습니다.');
        }

        const data = await response.json();
        
        // Base64 문자열을 Blob 바이너리로 변환 후 ZIP 다운로드
        downloadZipFile(`naver_blogs_${Date.now()}.zip`, data.zipData);
        setStatus(`총 ${data.count}개 블로그 글의 다운로드가 완료되었습니다.`, 'success');

      } catch (error) {
        setStatus(error.message, 'error');
      } finally {
        downloadBtn.disabled = false;
      }
    }

    // Base64 ZIP 데이터를 받아 파일 다운로드 트리거
    function downloadZipFile(filename, base64Data) {
      const byteCharacters = atob(base64Data);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: 'application/zip' });

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    function setStatus(message, className) {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = message;
      statusDiv.className = className;
    }
  </script>
</body>
</html>
